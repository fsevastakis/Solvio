version: "3"
services:
  frontend:
    build: "./frontend"
    ports:
      - "3000:3000"
    environment:
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}

  submitproblem:
    build: "./submitproblem"
    ports:
      - "5000:5000"
    depends_on:
      - db
      - rabbitmqquestions
    environment:
      - MONGO_DB_URI=mongodb://db/microservices1
      - RABBITMQ_QUESTIONS_URL=amqp://guest:guest@rabbitmqquestions:5672/
      - EXCHANGE_NAME=questionsExchange
      - JWT_KEY=${JWT_KEY}

  usersmanagement:
    build: "./usersmanagement"
    ports:
      - "5001:5000"
    depends_on:
      - db
      - rabbitmqanswers
    environment:
      - MONGO_DB_URI=mongodb://db/users
      - JWT_KEY=${JWT_KEY}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - EXCHANGE_NAME_ANSWERS=answersExchange
      - QUEUE_NAME_USERS_MANAGEMENT=UsersManagementQueue
      - RABBITMQ_ANSWERS_URL=amqp://guest:guest@rabbitmqanswers:5672/
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}

  showsubmissions:
    build: "./showsubmissions"
    ports:
      - "5002:5000"
    depends_on:
      - db
      - rabbitmqquestions
    environment:
      - MONGO_DB_URI=mongodb://db/microservices2
      - RABBITMQ_QUESTIONS_URL=amqp://guest:guest@rabbitmqquestions:5672/
      - EXCHANGE_NAME=questionsExchange
      - QUEUE_SHOW_SUBMISSIONS=showSubmissionsQueue
      - RABBITMQ_ANSWERS_URL=amqp://guest:guest@rabbitmqanswers:5672/
      - EXCHANGE_NAME_ANSWERS=answersExchange
      - QUEUE_VIEW_RESULTS=viewResultsQueue2
      - JWT_KEY=${JWT_KEY}

  solversproxy:
    build: "./solversproxy"
    ports:
      - "5003:5000"
    depends_on:
      - db
      - rabbitmqquestions
      - rabbitmqanswers
    environment:
      - MONGO_DB_URI=mongodb://db/microservices3
      - RABBITMQ_QUESTIONS_URL=amqp://guest:guest@rabbitmqquestions:5672/
      - RABBITMQ_ANSWERS_URL=amqp://guest:guest@rabbitmqanswers:5672/
      - QUEUE_NAME=ProxyQueue
      - EXCHANGE_NAME_QUESTIONS=questionsExchange
      - EXCHANGE_NAME_ANSWERS=answersExchange

  solver:
    build: "./solver"
    ports:
      - "5004:5000"

  emailservice:
    build: "./emailservice"
    ports:
      - "5005:5000"
    depends_on:
      - db
      - rabbitmqanswers
    environment:
      - MONGO_DB_URI=mongodb://db/googleusers
      - EXCHANGE_NAME_ANSWERS=answersExchange
      - QUEUE_NAME_EMAIL_SERVICE=EmailServiceQueue
      - RABBITMQ_ANSWERS_URL=amqp://guest:guest@rabbitmqanswers:5672/
      - APP_PWD=${APP_PWD}

  showresults:
    build: "./showresults"
    ports:
      - "5006:5000"
    depends_on:
      - db
      - rabbitmqanswers
    environment:
      - MONGO_DB_URI=mongodb://db/microservices4
      - RABBITMQ_ANSWERS_URL=amqp://guest:guest@rabbitmqanswers:5672/
      - EXCHANGE_NAME_ANSWERS=answersExchange
      - QUEUE_VIEW_RESULTS=viewResultsQueue
      - JWT_KEY=${JWT_KEY}

  viewstatistics:
    build: "./viewstatistics"
    ports:
      - "5007:5000"
    depends_on:
      - db
      - rabbitmqanswers
    environment:
      - MONGO_DB_URI=mongodb://db/microservices5
      - RABBITMQ_ANSWERS_URL=amqp://guest:guest@rabbitmqanswers:5672/
      - EXCHANGE_NAME=answersExchange
      - QUEUE_NAME=viewstatisticsQueue

  rabbitmqquestions:
    image: rabbitmq:3-management
    ports:
      - 5672:5672
      - 15672:15672
      - 25672:25672

  rabbitmqanswers:
    image: rabbitmq:3-management
    ports:
      - 5673:5672
      - 15673:15672
      - 25673:25672

  db:
    image: mongo
    ports:
      - "27016:27017"

  nginx:
    image: nginx:latest
    ports:
      - "8080:8080"
    volumes:
      - ./frontend/public:/srv/www/static
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - submitproblem
      - usersmanagement
      - showsubmissions
