version: "3"
services:
  frontend:
    build: "./frontend"
    ports:
      - "3000:3000"
    environment:
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}

  backend:
    build: "./backend"
    ports:
      - "5000:5000"
      - "5001:5000"
    depends_on:
      - db
    environment:
      - MONGO_DB_URI=mongodb://db/backend
      - JWT_KEY=${JWT_KEY}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - APP_PWD=${APP_PWD}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}

  solver:
    build: "./solver"
    ports:
      - "5004:5000"

  db:
    image: mongo
    ports:
      - "27016:27017"

  nginx:
    image: nginx:latest
    ports:
      - "8080:8080"
    volumes:
      - ./frontend/public:/srv/www/static
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
